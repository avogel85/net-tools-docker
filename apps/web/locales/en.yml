    description: Ping a host for up to half an hour and watch latency, jitter and loss per minute — smokeping-style, to catch intermittent problems a short ping misses.
    minutes: 'Duration (minutes, max {max})'
    interval: Interval (seconds)
    run: Start monitoring
    progress: Monitoring progress
    chart: Latency over time
    note: Runs from the NET-TOOLS server. Keep this page open; stopping or closing it ends the measurement.
    fields:
      probes: Replies / probes
      loss: loss
      latency: min / median / p95 / max
      jitter: Jitter
      minute: Minute
      sent: Probes
  dns-health-report:
    title: DNS health report
    description: One report for a zone — nameserver count and spread, lame or unresponsive servers, SOA serials and timers, DNSSEC, EDNS compliance, CAA and MX — with a grade.
    zone: Zone
    run: Check the zone
    note: Combines the DNS consistency, DNSSEC, EDNS compliance and lookup tools, run from the NET-TOOLS server.
    result: 'DNS health of {zone}'
    checks:
      nsCount: At least two nameservers
      nsDiversity: Nameservers in more than one network (/24)
      nsResponding: Every nameserver answers
      authoritative: Every nameserver is authoritative (no lame delegation)
      serials: SOA serial is the same on every server
      nsSets: NS set is the same on every server
      rtt: Nameservers answer within 500 ms
      soa: SOA record present
      soaRefresh: SOA refresh 20 min – 1 day
      soaRetry: SOA retry at least 2 min and below refresh
      soaExpire: SOA expire 1 – 4 weeks
      soaMinimum: SOA minimum (negative caching) 5 min – 1 day
      dnssec: DNSSEC
      edns: EDNS compliance of the nameservers
      caa: CAA record restricts certificate issuers
      mx: Mail exchangers
  email-deliverability-report:
    title: Email deliverability report
    description: One score for a mail domain — MX and STARTTLS, SPF, DKIM, DMARC policy and reporting, MTA-STS, TLS-RPT, BIMI, DANE and reverse DNS of the mail server.
    domain: Mail domain
    selector: DKIM selector (optional)
    run: Check the domain
    note: 'Combines the email, DANE and SMTP banner tools, run from the NET-TOOLS server. Many hosting networks block outgoing port 25; the STARTTLS and banner checks are then skipped. DKIM needs a selector (see the s= tag in the DKIM-Signature header of a sent message).'
    result: 'Deliverability of {domain}'
    checks:
      mx: Mail exchangers (MX)
      starttls: Every MX offers STARTTLS
      mxCert: MX certificates are valid
      spf: SPF record valid
      spfAll: SPF ends with -all or ~all
      spfLookups: 'SPF uses at most 10 DNS lookups ({n})'
      dmarc: DMARC record valid
      dmarcPolicy: DMARC policy quarantine or reject, for all mail
      dmarcRua: DMARC aggregate reports requested (rua)
      dkim: DKIM key published
      mtaSts: MTA-STS policy in enforce mode
      tlsRpt: TLS-RPT reporting set up
      bimi: BIMI record (brand logo)
      dane: DANE / TLSA for the MX hosts
      fcrdns: 'Reverse DNS of {host} confirms forward (FCrDNS)'
  m365-domain-check:
    title: Microsoft 365 domain check
    description: The DNS records Microsoft 365 needs (MX, SPF, Autodiscover, DKIM, DMARC, Intune, Teams) and the tenant behind a domain — ID, region, managed or federated sign-in.
