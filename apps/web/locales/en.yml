    title: CSP builder & evaluator
    description: Build a Content-Security-Policy from presets (strict nonce-based, allowlist, lockdown), evaluate it for XSS bypasses and missing directives, and copy it as header, nginx, Apache or meta tag.
    policy: Policy
    help: "Directives are separated by ;. With a nonce or hash, 'unsafe-inline' is ignored by modern browsers (it is a fallback for old ones); with 'strict-dynamic', host and scheme sources are ignored too. Replace the RANDOM placeholder with a fresh nonce for every response."
    nonce: Insert a random nonce
    evaluation: Evaluation
    directive: Directive
    values: Sources
    output: Output
    format: Format
    reportOnly: Report-only (monitor, do not block)
    metaNote: In a meta tag frame-ancestors, report-to, report-uri and sandbox do not work, and report-only is not possible.
    presets:
      strict: Strict (nonce + strict-dynamic)
      allowlist: Allowlist starter
      lockdown: Lock down
    outputs:
      header: HTTP header
      nginx: nginx add_header
      apache: Apache Header
      meta: HTML meta tag
    score:
      good: No weaknesses found.
      warn: The policy works, but has weaknesses.
      bad: The policy does not stop XSS reliably.
    findings:
      empty: The policy is empty.
      duplicate: Duplicate directive — browsers use only the first one.
      deprecated: Deprecated directive; browsers ignore it.
      unknown: Unknown directive (typo?) — browsers ignore it.
      noScriptSrc: Neither script-src nor default-src is set, so any script may run.
      unsafeInline: "'unsafe-inline' allows inline scripts, so injected markup can run — use nonces or hashes."
      unsafeInlineFallback: "'unsafe-inline' is ignored because a nonce or hash is present (fallback for old browsers)."
      unsafeEval: "'unsafe-eval' allows eval() and similar; avoid it if you can."
      unsafeHashes: "'unsafe-hashes' allows inline event handlers that match a hash."
      strictDynamicNoNonce: "'strict-dynamic' without a nonce or hash blocks all scripts."
      strictDynamicHosts: "Host and scheme sources are ignored because of 'strict-dynamic' (fallback for old browsers)."
      scriptWildcard: 'Allows scripts from anywhere ({detail}).'
      bypassHost: 'These hosts serve JSONP or AngularJS that can bypass an allowlist: {detail}.'
      selfOnly: "Only 'self' — safe as long as no user-controlled files are served from your origin."
