  domain-scorecard:
    title: Domain scorecard
    description: One score for a domain, like internet.nl — website (IPv6, HTTPS, TLS, redirect, security headers, HSTS, HTTP/2 and HTTP/3), email (SPF, DMARC, MTA-STS, STARTTLS, DANE) and DNS (name servers, DNSSEC, SOA, CAA).
    run: Score the domain
    note: Combines about 14 checks from the web, TLS, email and DNS tools, run from the NET-TOOLS server three at a time; this takes up to a minute. DKIM and reverse DNS of the mail server are in the email deliverability report.
    progress: '{done} of {total} checks done'
    result: 'Scorecard for {domain}'
    sections:
      web: Website
      mail: Email
      dns: DNS
    checks:
      ipv6: IPv6 for web, mail and name servers
      https: HTTPS with a valid certificate
      tlsVersion: Negotiates TLS 1.3
      certExpiry: 'Certificate valid for at least 30 days ({days} d)'
      httpsRedirect: http:// redirects to https://
      headers: Security headers grade A or better
      hsts: HSTS (Strict-Transport-Security)
      http2: HTTP/2
      http3: HTTP/3 (QUIC)
  ipv6-test:
    title: IPv6 connection test
    description: Is IPv6 working on the connection of this browser? IPv4 and IPv6 reachability, which one dual-stack sites use, slow fallback from broken IPv6 — scored out of 10, like test-ipv6.com.
    intro: Your browser fetches small answers from public test endpoints (ipify, Cloudflare) over IPv4, IPv6 and dual stack. Nothing goes through the NET-TOOLS server.
    run: Run again
    result: Result
    details: Tests
    scoreLabel: 'IPv6 readiness {score} out of 10'
    ok: 'OK over {family}'
    prefersV6: Dual-stack sites are reached over IPv6.
    prefersV4: Dual-stack sites are reached over IPv4, although IPv6 works (the browser or OS prefers IPv4).
    slowFallback: Dual-stack sites load more than a second slower than IPv4-only ones. IPv6 is probably configured but broken, and the browser waits before falling back to IPv4.
    note: 'An IPv6 address literal cannot be tested here (browsers do not allow it under this page''s content security policy), and neither can large packets over IPv6 (MTU problems). Click an address to look up its network.'
    verdicts:
      ipv6-ok: IPv6 and IPv4 both work. This connection is ready for IPv6.
      ipv4-only: Only IPv4 works. Sites are reachable, but this connection has no IPv6; ask your provider or check the router.
      ipv6-only: Only IPv6 works directly; IPv4 sites are reached through NAT64 or a similar translation.
      broken: The dual-stack test failed while single-stack tests worked. Something on the path breaks dual-stack connections (DNS, firewall or a proxy).
      offline: None of the test endpoints could be reached. The connection may be down, or a filter or extension blocks them.
    probes:
      v4: IPv4 (name with only an A record)
      v6: IPv6 (name with only an AAAA record)
      dual: Dual stack (A and AAAA)
      v4literal: IPv4 without DNS (1.1.1.1)
    errors:
      timeout: Timed out
      network: Failed
      parse: Unexpected answer
    columns:
      test: Test
      result: Result
      ip: Your address
      ms: Time
