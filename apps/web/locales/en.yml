    title: Social preview checker
    description: See how a link looks when shared on LinkedIn, Facebook, X, Slack or Teams — Open Graph and Twitter card tags, the preview image, favicon and manifest — and what is missing.
    url: Page URL
    run: Check preview
    ok: All the tags social networks use are present.
    preview: Preview
    large: Large image card (LinkedIn, Facebook, Slack)
    summary: Summary card (X with twitter:card summary)
    noImage: No preview image
