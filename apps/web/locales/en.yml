  cache-header-analyzer:
    title: Cache header analyzer
    description: How long may browsers and CDNs cache a URL? Explains Cache-Control, Expires, validators and Vary (RFC 9111) and repeats the request to test 304 revalidation and cache hits.
    run: Analyze
    notCached: Not stored
    unknown: No lifetime (revalidated every time)
    noValidator: no validator
    repeatValue: 'sent {sent} → HTTP {status}, cache {cache}'
    sources:
      max-age: max-age
      max-age_s-maxage: max-age, s-maxage for shared caches
      expires: Expires header
      expires_s-maxage: Expires, s-maxage for shared caches
      heuristic: Heuristic (10 % of the time since Last-Modified)
      heuristic_s-maxage: Heuristic, s-maxage for shared caches
      s-maxage: s-maxage (shared caches only)
      none: None
    fields:
      url: URL
      browser: Browser cache lifetime
      shared: CDN / proxy cache lifetime
      source: Lifetime from
      cacheStatus: CDN cache status
      repeat: Conditional repeat
    findings:
      maxAgeZero: 'max-age=0: caches may store it but must revalidate before every use.'
      noStore: 'no-store: nothing may be cached, not even by the browser.'
      noCache: 'no-cache: may be stored, but must be revalidated with the server before every use.'
      noLifetime: No explicit lifetime (max-age or Expires) — caches decide for themselves.
      heuristic: Only Last-Modified is set, so caches guess a lifetime (typically 10 % of its age). Set max-age explicitly.
      private: 'private: only the browser may cache this, not CDNs or proxies.'
      publicPrivate: Both public and private are set — contradictory.
      immutable: 'immutable: browsers will not revalidate during the lifetime, even on reload.'
      noValidators: No ETag or Last-Modified — expired copies cannot be revalidated cheaply (304) and are downloaded again.
      varyStar: 'Vary: * makes the response effectively uncacheable for shared caches.'
      varyFragment: 'Vary: {detail} splits the cache per cookie or browser and lowers the hit rate.'
      setCookieShared: The response sets a cookie but may be stored by shared caches — the cookie could be served to other users. Add private or no-store.
      pragmaOnly: 'Only the legacy Pragma: no-cache is set; HTTP/1.1 caches use Cache-Control.'
      expiresInvalid: 'Invalid Expires value ({detail}): treated as already expired.'
      no304: 'The repeat request with {detail} did not return 304 Not Modified, so revalidation downloads the full response.'
