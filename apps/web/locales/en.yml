email:
  domain: Domain
  findings:
    dns-error: The DNS lookup failed.
    no-record: No record was found.
    nxdomain: The domain does not exist.
    multiple-records: More than one record exists — receivers treat this as an error.
    include-loop: The SPF includes form a loop.
    include-missing: An included domain has no SPF record (permanent error at receivers).
    plus-all: '"+all" lets anyone send mail as this domain.'
    neutral-all: '"?all" expresses no policy; prefer "~all" or "-all".'
    no-all: The record does not end with an "all" mechanism.
    too-many-lookups: More than 10 DNS lookups — receivers return a permanent error.
    too-many-void-lookups: More than 2 lookups return nothing — receivers may return a permanent error.
    ptr-deprecated: The "ptr" mechanism is deprecated and slow.
    unknown-mechanism: The record contains an unknown mechanism.
    syntax: The record has a syntax error.
    policy-none: Policy "none" only monitors; it does not protect the domain.
    partial-pct: The policy applies to only part of the mail (pct below 100).
    no-rua: No aggregate reports (rua) are requested.
    missing-policy: The required p= tag is missing.
    invalid-policy: The policy value is not none, quarantine or reject.
    invalid-pct: The pct value is not between 0 and 100.
    unauthorized-external-report: An external report address has not authorized receiving reports for this domain.
    bad-version: The record version is not DKIM1.
    revoked: The key is revoked (empty p=).
    bad-key: The public key cannot be decoded.
    weak-key: The RSA key is shorter than 1024 bits and is ignored by receivers.
    short-key: The RSA key is shorter than the recommended 2048 bits.
    flatten-query-limit: More than 100 DNS queries were needed; the result is incomplete.
    too-many-mx: An mx mechanism points to more than 10 mail servers; only the first 10 were used.
    too-many-prefixes: More than 2000 address ranges; the list was cut off.
    record-too-long: A record is longer than the chosen maximum size.
    include-non-pass: An included record contains a non-pass mechanism ("-", "~" or "?"); it is left out, so the flattened policy can allow slightly more.
    macro-kept: A term with a macro (such as %{'{'}i{'}'}) cannot be flattened and is kept as-is.
    exists-kept: An "exists" mechanism cannot be flattened and is kept as-is.
    order-changed: Non-pass mechanisms ("-", "~" or "?") are placed before the addresses; check that the order still gives the result you want.
    chain-name-in-use: A chained record name is already used by the current policy; choose another chain label.
    chain-name-exists: A TXT record already exists at a chained record name; publishing replaces it (expected when you flatten again).
    testing: The key is in testing mode (t=y).
    no-id: The MTA-STS record has no id= tag.
    policy-unreachable: The policy file on the mta-sts subdomain cannot be fetched.
    policy-not-found: The policy file returned an error (not 200).
    policy-certificate: The policy host's certificate is not valid — senders ignore the policy.
    policy-content-type: The policy file is not served as text/plain.
    policy-version: The policy file does not declare version STSv1.
    policy-mode: The policy mode is not enforce, testing or none.
    policy-max-age: max_age is missing or longer than one year.
    short-max-age: max_age is under one day; senders will re-fetch the policy very often.
    policy-no-mx: The policy lists no MX patterns.
    mode-testing: Mode is testing — failures are reported but mail is still delivered.
    mode-none: Mode is none — the policy is switched off.
    mx-not-covered: Some MX hosts are not matched by the policy.
    bad-rua: 'A report address is neither mailto: nor https://.'
    no-logo: No logo (l=) is published.
    logo-not-https-svg: The logo must be an SVG served over HTTPS.
    logo-unreachable: The logo cannot be fetched.
    logo-not-tiny-ps: The logo is not SVG Tiny PS (baseProfile="tiny-ps"), which BIMI requires.
    logo-too-large: The logo is larger than 32 KB.
    no-vmc: No VMC/CMC certificate (a=); Gmail and Apple Mail show logos only with one.
    dmarc-not-enforced: BIMI requires DMARC at p=quarantine or p=reject with pct=100.
