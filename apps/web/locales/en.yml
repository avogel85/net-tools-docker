    description: List a domain's mail servers and test each on port 25 — banner, ESMTP extensions, STARTTLS and certificate.
    probe: Connect to port 25 (SMTP)
    run: Look up
    nullMx: This domain publishes a null MX (RFC 7505) — it does not accept email.
    implicit: No MX records — senders fall back to the domain's own address (implicit MX).
    status:
      ok: STARTTLS, valid certificate
      no-starttls: No STARTTLS
      cert: STARTTLS, certificate problem
      unreachable: Unreachable
  spf-checker:
    title: SPF checker
    description: Parse a domain's SPF record, expand every include, count DNS lookups against the limit of 10 and flag mistakes.
    run: Check SPF
    ok: The SPF record is valid.
    lookups: '{n} of 10 DNS lookups used'
    tree: Expanded record
  spf-flattener:
    title: SPF flattener
    description: Replace the includes, a and mx terms of an SPF record with the IP ranges they resolve to, to stay under the limit of 10 DNS lookups. Splits the result over chained records when it gets too long.
    run: Flatten
    ok: The SPF record was flattened without remarks.
    label: Chain label
    invalidLabel: Use letters, digits, - and _ (for example _spf), at most 30.
    size: Maximum record size (bytes)
    invalidSize: Enter a size between 100 and 2048.
    records: Flattened records
    summary: '{before} → {after} DNS lookups · {ip4} IPv4 and {ip6} IPv6 ranges in {records} record(s)'
    bytes: '{n} bytes'
    zone: Zone file
    staleTitle: Flattened records go out of date
    stale: The addresses are a snapshot of what the providers publish now. When a provider changes its IP ranges, mail from the new addresses fails SPF until you flatten again. Re-run this regularly or automate it, and keep the original record somewhere for reference.
    sources: Where the addresses come from
    kept: kept as-is
  dmarc-generator:
    title: DMARC record generator
    description: Build a DMARC record step by step — policy, alignment, percentage and report addresses — with the authorization records external report addresses need.
    policy: Policy for the domain
    policies:
      none: Monitor (none)
      quarantine: Quarantine
      reject: Reject
    sp: Subdomain policy (sp)
    inherit: Same as the domain
    adkim: DKIM alignment
    aspf: SPF alignment
    relaxed: Relaxed
    strict: Strict
    pct: Apply to (pct)
    ri: Aggregate report interval
    interval:
      '3600': Every hour
      '14400': Every 4 hours
      '86400': Daily (default)
    rua: Aggregate report addresses (rua)
    ruf: Failure report addresses (ruf, optional)
    invalidAddress: Enter e-mail addresses separated by commas, for example dmarc{'@'}example.com.
    fo: Send failure reports when
    foOptions:
      '0': SPF and DKIM both fail
      '1': SPF or DKIM fails
      d: DKIM fails
      s: SPF fails
    authorizationHint: The report addresses are in another domain. That domain must publish the authorization record(s) above, or receivers will not send it reports.
    findings:
      ruf-privacy: Failure reports can contain parts of messages (personal data), and many receivers do not send them.
      sp-none: Subdomains are only monitored while the domain itself is protected.
    import: Start from an existing record
    load: Load
    importError: This is not a DMARC record (it must start with v=DMARC1).
  email-provider-detector:
    title: Email provider detector
    description: See which providers a domain uses for receiving and sending mail, which security gateway filters it, where DMARC reports go and which SaaS services it has verified — from public DNS only.
    run: Detect providers
    none: No known providers were recognised in this domain's DNS.
    roles:
      inbound: Mailbox provider
      gateway: Security gateway
      sending: Sending services
      reporting: DMARC reporting
      verification: Verified SaaS services
    roleHints:
      inbound: From the MX records.
      gateway: Filters mail before it reaches the mailbox (from the MX records).
      sending: Allowed to send as this domain (SPF includes and DKIM selectors).
      reporting: Receives the DMARC aggregate reports.
      verification: Domain-ownership tokens in TXT records.
    records: Records read
    limits: Detection uses lists of known host names and token prefixes; only top-level SPF includes and a fixed set of DKIM selectors are checked.
  email-validator:
    title: Email address validator
    description: Check up to 50 e-mail addresses — syntax, whether the domain accepts mail (MX, null MX), disposable and role addresses, and likely typos. No mail is sent.
    addresses: Addresses (one per line)
    hint: The domain's DNS is checked; the mailbox itself cannot be verified without sending mail, so "valid" means the address can receive mail, not that it exists. Addresses are not stored or put in the URL.
    tooMany: At most {max} addresses per check.
    run: Check {n} address(es)
    address: Address
    verdict: Verdict
    notes: Notes
    implicit: none (uses A/AAAA)
    verdicts:
      valid: Valid
      risky: Risky
      invalid: Invalid
    findings:
      syntax: Not an e-mail address.
      local-too-long: The part before the {'@'} is longer than 64 characters.
      local-syntax: The part before the {'@'} contains characters that need quoting or a misplaced dot.
      address-literal: An IP address literal instead of a domain — almost no provider accepts this.
      domain-syntax: The domain is not a valid domain name.
      too-long: The address is longer than 254 characters.
      smtputf8: The address uses non-ASCII characters; the sending and receiving servers must support SMTPUTF8.
      no-mail-domain: The domain does not exist or has no mail server.
      null-mx: The domain publishes a null MX — it does not accept mail.
      implicit-mx: No MX record; mail goes to the domain's own address (works, but unusual).
      dns-error: The DNS lookup failed; try again.
      not-checked: More than 25 different domains; this one was not looked up.
      disposable: A disposable (throw-away) mail service.
      role: A role address (shared mailbox) rather than a person.
      typo: Did you mean {suggestion}?
  dkim-verifier:
    title: DKIM signature verifier
    description: Paste a raw message (or open an .eml file) to verify each DKIM signature — body hash and signature against the published key — and see whether it aligns with the From domain.
    message: Raw message
    placeholder: Paste the full message source, headers included ("Show original" / "View source" in your mail client).
    hint: Paste the original source; copying the visible text loses the headers. The message is sent to the server only to verify it, is not stored and does not appear in the URL.
    notRaw: This does not look like a raw message — it should start with header lines such as "Received:" or "DKIM-Signature:".
    tooBig: The message is larger than 900 KB.
    run: Verify signatures
    open: Open .eml file
    ok: At least one valid signature aligns with the From domain — DKIM passes for DMARC.
    problems:
      not-a-message: This could not be read as an e-mail message.
      no-signature: The message has no DKIM-Signature header.
      too-many-signatures: More than 10 signatures; only the first 10 were checked.
      no-aligned-pass: No valid signature from the From domain, so DKIM does not count for DMARC.
    signature: 'Signature {n} — {domain}'
    results:
      pass: Valid
      fail: Invalid
      permerror: Permanent error
      temperror: Temporary error
    aligned: Aligned with From
    notAligned: Not aligned with From
    selector: Key record
    algorithm: Algorithm
    headers: Signed headers
    signed: Signed / expires
    error: Error
    key: Published key
    warnings:
      body-changed: The body was changed after signing (often a footer added by a list or gateway).
      body-length: The signature covers only part of the body (l= tag); content can be appended without breaking it.
      sha1: RSA-SHA1 is deprecated and rejected by many receivers.
      from-not-signed: The From header is not signed, so the signature says nothing about the sender.
    receivers: What the receiving servers concluded
    receiversHint: Authentication-Results and ARC headers added along the way (ARC seals are shown, not verified).
  sip-check:
    title: SIP server check
    description: Find a domain's SIP servers (NAPTR and SRV) and send a SIP OPTIONS request over UDP, TCP and TLS to see whether the server answers, which software it runs and what it allows.
    host: SIP domain or server
    transport: Transport
    transports:
      all: UDP, TCP and TLS
      udp: UDP
      tcp: TCP
      tls: TLS
    hint: With a domain, the first SRV target is probed on the ports from DNS; otherwise 5060 (UDP/TCP) and 5061 (TLS). OPTIONS does not place a call.
    run: Check
    probes: OPTIONS to {host}
    server: Server
    allow: Allowed methods
    cert: Certificate
    expires: '{days} days left'
    untrusted: not trusted
    statusHint: Any SIP reply means the server is reachable; 401, 403 or 404 are normal for servers that only accept known peers.
    discovery: Discovery
    service: Service
    priority: Priority
    weight: Weight
    target: Target
    errors:
      no-reply: No reply (filtered, or no SIP server)
      refused: Connection refused
      timeout: Timed out
      tls-failed: TLS handshake failed
      not-sip: Replied, but not with SIP
      dial-failed: Could not open a socket
      send-failed: Sending failed
  ldap-check:
    title: LDAP / LDAPS check
    description: Read the rootDSE of an LDAP server anonymously (naming contexts, versions, SASL mechanisms, AD functional levels) and check StartTLS and the LDAPS certificate. No bind is made.
    host: LDAP server
    mode: Check
    modes:
      both: LDAP (389) and LDAPS (636)
      ldap: LDAP with StartTLS
      ldaps: LDAPS only
    hint: Domain controllers are usually internal; private addresses need the LAN profile or ALLOW_PRIVATE_TARGETS. host:port selects another port.
    run: Check
    answered: rootDSE read
    startTls: StartTLS supported
    noStartTls: No StartTLS
    trusted: trusted certificate
    untrusted: untrusted certificate
    cert: Certificate
    daysLeft: '{n} days left'
    warnings:
      no-starttls: Plain LDAP without StartTLS — directory traffic, including passwords on simple binds, can only travel unencrypted on port 389.
      cert-untrusted: The certificate is not trusted (self-signed, internal CA or wrong name); clients must trust that CA explicitly.
      cert-expiring: The certificate expires within 30 days.
    errors:
      refused: Connection refused
      timeout: Timed out
      tls-failed: TLS handshake failed
      closed: The server closed the connection
      search-refused: The server refused the anonymous rootDSE search
      protocol-error: No valid LDAP response
  remote-access-check:
    title: Remote access check
    description: See whether RDP, VNC or SSH is reachable on a host and how it is protected — RDP network level authentication and certificate, VNC security types, SSH version. No credentials are sent.
    host: Host
    service: Services
    services:
      all: RDP, VNC and SSH
      rdp: RDP (3389)
      vnc: VNC (5900)
      ssh: SSH (22)
    hint: Use it to check what your own hosts expose. host:port checks another port (with a single service). For a full SSH audit, use the SSH server audit tool.
    run: Check
    exposed: At least one remote access service is reachable from this server. Remote desktop services should normally sit behind a VPN or gateway.
    open: Reachable
    protocol: Security
    protocols:
      rdp: Standard RDP security (no TLS)
      tls: TLS
      credssp: CredSSP / NLA
      credssp-ex: CredSSP / NLA (extended)
      rdstls: RDSTLS
      unknown: Unknown
    required: required
    optional: not required
    cert: Certificate
    untrusted: not trusted
    findings:
      rdp-nla-not-required: NLA is not required — anyone can reach the Windows login screen without authenticating first, which exposes the host to pre-authentication attacks.
      rdp-legacy-security: The server uses standard RDP security without TLS, which is weak and open to man-in-the-middle attacks.
      vnc-no-auth: VNC accepts connections without any authentication — anyone can take over the screen.
      vnc-unencrypted: VNC only offers unencrypted security types; the session (and password challenge) is not protected.
      ssh-v1: The server only speaks SSH protocol 1, which is broken.
    errors:
      refused: Closed (connection refused)
      timeout: No answer (filtered)
      closed: The server closed the connection
      protocol-error: Something else answers on this port
      negotiation-failed: RDP negotiation failed
  ike-probe:
    title: IPsec / IKE probe
    description: Probe an IPsec VPN gateway with an IKEv2 and an IKEv1 handshake request to see which versions, proposals and Diffie-Hellman groups it accepts, whether it supports IKE fragmentation and which vendor IDs it sends. No authentication is attempted.
    host: VPN gateway
    port: Port
    hint: Gateways often answer only peers they know, or rate-limit; no answer does not prove that nothing listens. Common modern proposals (AES-GCM, AES-CBC with SHA-2, X25519/ECP/MODP-2048) are offered.
    run: Probe
    verdict:
      ikev2: IKEv2 accepted
      ikev1-only: Only IKEv1 accepted
      answers: The gateway answers but accepted no offered proposal
      silent: No IKE answer
    findings:
      no-answer: Nothing answered on this port (filtered, no IPsec, or the gateway only answers known peers).
      ikev1-enabled: IKEv1 is enabled. It is deprecated (RFC 9395); use IKEv2 only where possible.
      ikev1-weak: The IKEv1 proposal it chose uses SHA-1, MD5 or (3)DES.
      weak-group: A weak Diffie-Hellman group (MODP-768/1024/1536) is accepted.
      weak-cipher: IKEv2 chose 3DES.
    accepted: Proposal accepted
    noProposal: No proposal chosen
    answered: Answered
    silent: No answer
    fragmentation: IKE fragmentation
    cookie: Cookie (DoS protection)
    encryption: Encryption
    hash: Hash
    group: DH group
    weak: weak
    vendorIds: Vendor IDs
  udp-probe:
    title: UDP service probe
    description: Check UDP services the way their clients do — DNS, NTP, SNMPv3, SIP, STUN, IKE, QUIC, OpenVPN, NetBIOS and TFTP — to tell an open service from a filtered port.
    host: Host
    service: Service
    port: Port
    default: default
    services:
      all: All known services
      custom: Custom port (empty packet)
      dns: DNS (53)
      ntp: NTP (123)
      snmp: SNMPv3 (161)
      sip: SIP (5060)
      stun: STUN (3478)
      ike: IKE (500)
      quic: QUIC (443)
      openvpn: OpenVPN (1194)
      netbios: NetBIOS name service (137)
      tftp: TFTP (69)
    hint: Each service gets a real request (SNMPv3 engine discovery without a community or user; TFTP asks for a random file name). A UDP port with no answer can be open or filtered — only an answer or an ICMP "port unreachable" is conclusive.
    run: Probe
    results: '{host} ({address})'
    openCount: '{n} of {total} open'
    state: State
    detail: Details
    states:
      open: Open
      closed: Closed
      open|filtered: Open or filtered
      unexpected: Answered (other protocol)
      error: Error
    statesHint: Closed means the host answered with ICMP "port unreachable"; open or filtered means nothing came back, which also happens when a firewall drops the packet.
  reverse-traceroute:
    title: Reverse traceroute
    description: Trace the path from Globalping probes around the world back to your own public IP — the return path your traffic takes, which is often different from the way out.
    intro: Internet routing is often asymmetric. This runs a traceroute from probes in the locations you choose towards your public IP, so you can see how other networks reach you.
    yourIp: 'Trace to:'
    noIp: Your public IP could not be determined (ipify is unreachable).
    locations: Probe locations (up to 5)
    privacy: Your public IP is sent to Globalping, a public measurement network, and the measurement is public there.
    run: Trace back to me
    paths: Networks on the way to you
    pathsHint: The autonomous systems each probe's path crosses; different paths from nearby locations point to different upstreams or peering.
  radius-tester:
    title: RADIUS tester
    description: Check a RADIUS server (FreeRADIUS, NPS, a Wi-Fi controller) with Status-Server or a test Access-Request, and verify the reply with the shared secret.
    host: RADIUS server
    port: Port
    secret: Shared secret
    mode: Test
    modes:
      status: Status-Server (is it alive?)
      auth: Access-Request (PAP)
    username: Test user name
    password: Test password
    hint: NET-TOOLS must be registered as a client (NAS) on the RADIUS server for its own IP, or the server silently ignores it. The secret and password are sent to this server in the request body only and are not stored. Use a test account.
    run: Test
    verdict:
      ok: The server answered and the secret matches
      rejected: The server rejected the user, and the secret matches
      untrusted: The reply is not signed with this secret
      silent: No reply
      closed: Port closed
    explain:
      ok: '{result} after {ms} ms. The reply carries a valid response authenticator for this secret.'
      rejected: '{result} after {ms} ms: wrong user name or password, or a policy (time, group, NAS) refused it. The shared secret itself is correct.'
      untrusted: '{result} after {ms} ms, but the response authenticator does not match: the shared secret differs from the one on the server.'
      silent: Nothing came back. Usually the shared secret is wrong or NET-TOOLS is not a registered client (servers drop such requests without answering); otherwise a firewall blocks UDP to this port, or Status-Server is disabled.
      closed: The host answered with ICMP "port unreachable" — no RADIUS server listens on this port.
    results:
      accept: Access-Accept
      reject: Access-Reject
      challenge: Access-Challenge
      other: Another reply
      no-reply: No reply
      refused: Refused
      error: Error
