    details: Tags
    image: Preview image
    imageFailed: Could not be fetched
    canonical: Canonical URL
    icons: Icons
    manifest: Web app manifest
    findings:
      missing-title: The page has no title at all.
      missing-og-title: No og:title — networks fall back to the HTML title.
      missing-description: No description (og:description or meta description).
