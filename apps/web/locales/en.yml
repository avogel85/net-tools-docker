    title: DNS hijack & proxy check
    description: Does the DNS on this network differ from public DNS (filtering, NXDOMAIN hijacking), and is there an HTTP proxy between your browser and this server that adds or changes headers?
    run: Run checks
    note: 'The NET-TOOLS server resolves a few names (and one random name that cannot exist) with its own resolver, and your browser asks Cloudflare DNS over HTTPS for the same names. Your browser also sends a random marker header to the server, which reports back what arrived. The DNS part shows the server''s network — in a homelab usually the same resolver as yours.'
