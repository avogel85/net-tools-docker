      nx-hijack: 'NXDOMAIN hijacking: the resolver returns an address for a name that does not exist (typical for ISP "search" redirects or some DNS filters).'
      blocked: Some names are blocked by the resolver (no answer or a sinkhole address such as 0.0.0.0) — a DNS filter such as Pi-hole, or a censored network.
      differ: The resolver gives different addresses than public DNS — normal for CDNs and geo-DNS, suspicious only for names with fixed addresses.
      clean: The resolver answers like public DNS, and non-existent names stay non-existent.
    verdicts:
      match: Same answer
      differ: Different addresses
      blocked: Blocked
      nx-hijack: Hijacked (should not exist)
      ok-nx: Does not exist (correct)
      error: Lookup failed
    findings:
      clean: No proxy seen — the request arrived unchanged (apart from this server's own reverse proxy).
